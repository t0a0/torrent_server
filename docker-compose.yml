services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    depends_on:
      - qbittorrent
      - file-server
    volumes:
      - ./volumes/downloads:/downloads
      - ./volumes/auth:/auth
    develop:
      watch:
        - action: sync+restart
          path: ./app
          target: /app/app
        - action: rebuild
          path: Dockerfile
    restart: unless-stopped

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    environment:
      PUID: 1000
      PGID: 1000
      TZ: UTC
      WEBUI_PORT: 8080
    ports:
      - "8080:8080"
      - "6881:6881"
      - "6881:6881/udp"
    volumes:
      - ./volumes/qbittorrent_config:/config
      - ./volumes/downloads:/downloads
    restart: unless-stopped

  file-server:
    build:
      context: ./docker/file-server
    depends_on:
      - qbittorrent
    env_file:
      - .env
    ports:
      - "8081:8081"
    volumes:
      - ./volumes/downloads:/srv/downloads:ro
    restart: unless-stopped
