services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    depends_on:
      - qbittorrent
      - file-server
    volumes:
      - downloads:/downloads
    environment:
      DOWNLOADS_ROOT: /downloads
      QBITTORRENT_URL: http://qbittorrent:8080
    develop:
      watch:
        - action: sync+restart
          path: ./app
          target: /app/app
        - action: rebuild
          path: Dockerfile
    restart: unless-stopped

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    environment:
      PUID: 1000
      PGID: 1000
      TZ: UTC
      WEBUI_PORT: 8080
    ports:
      - "8080:8080"
      - "6881:6881"
      - "6881:6881/udp"
    volumes:
      - qbittorrent_config:/config
      - downloads:/downloads
    restart: unless-stopped

  file-server:
    build:
      context: ./docker/file-server
    depends_on:
      - qbittorrent
    ports:
      - "8081:8081"
    volumes:
      - downloads:/srv/downloads:ro
    environment:
      DOWNLOAD_LINK_SECRET: ${DOWNLOAD_LINK_SECRET}
    restart: unless-stopped

volumes:
  qbittorrent_config:
  downloads:
