services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    depends_on:
      - qbittorrent
      - file-server
    volumes:
      - downloads:/downloads
    environment:
      DOWNLOADS_ROOT: /downloads
      QBITTORRENT_URL: http://qbittorrent:8080
    restart: unless-stopped

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    environment:
      PUID: 1000
      PGID: 1000
      TZ: UTC
      WEBUI_PORT: 8080
    ports:
      - "8080:8080"
      - "6881:6881"
      - "6881:6881/udp"
    volumes:
      - qbittorrent_config:/config
      - downloads:/downloads
    restart: unless-stopped

  file-server:
    image: nginx:1.27-alpine
    depends_on:
      - qbittorrent
    ports:
      - "8081:8081"
    volumes:
      - downloads:/srv/downloads:ro
      - ./docker/file-server/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

volumes:
  qbittorrent_config:
  downloads:
