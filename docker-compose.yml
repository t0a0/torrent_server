services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    depends_on:
      - qbittorrent
      - file-server
    ports:
      # Proxy admin page, bound to localhost only. The host's reverse proxy (the one
      # already serving the other subdomains) terminates HTTPS and forwards here; the
      # port is never exposed as plaintext on the public IP.
      - "127.0.0.1:${ADMIN_WEB_PORT:-8082}:${ADMIN_WEB_PORT:-8082}"
    volumes:
      - ./volumes/downloads:/downloads
      - ./volumes/auth:/auth
    develop:
      watch:
        - action: sync+restart
          path: ./app
          target: /app/app
        - action: rebuild
          path: Dockerfile
    restart: unless-stopped

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    environment:
      PUID: 1000
      PGID: 1000
      TZ: UTC
      WEBUI_PORT: 8080
    ports:
      # Web UI on localhost only; reached through the host's reverse proxy (HTTPS).
      - "127.0.0.1:8080:8080"
      # BitTorrent peer port stays public so peers can open incoming connections.
      - "6881:6881"
      - "6881:6881/udp"
    volumes:
      - ./volumes/qbittorrent_config:/config
      - ./volumes/downloads:/downloads
    restart: unless-stopped

  file-server:
    build:
      context: ./docker/file-server
    depends_on:
      - qbittorrent
    env_file:
      - .env
    ports:
      # Localhost only; reached through the host's reverse proxy (HTTPS).
      - "127.0.0.1:8081:8081"
    volumes:
      - ./volumes/downloads:/srv/downloads:ro
    restart: unless-stopped
