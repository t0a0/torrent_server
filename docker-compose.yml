services:
  bot:
    build:
      context: .
    env_file:
      - .env
    depends_on:
      - qbittorrent
    volumes:
      - app_data:/app/data
    restart: unless-stopped

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${QBITTORRENT_TZ:-Europe/Berlin}
      - WEBUI_PORT=8080
    volumes:
      - qb_config:/config
      - qb_downloads:/downloads
    restart: unless-stopped

volumes:
  app_data:
  qb_config:
  qb_downloads:
