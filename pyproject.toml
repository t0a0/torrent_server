[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "torrent-server"
version = "0.1.0"
description = "Private torrent queue and delivery server"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aiogram~=3.13.1",
  "qbittorrent-api~=2024.8",
]

[project.optional-dependencies]
dev = [
  "pytest~=8.3",
  "ruff~=0.6.8",
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
